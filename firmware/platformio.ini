[platformio]
default_envs = xiao-sense

[env:xiao-sense]
platform = espressif32@6.10.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -D TRACKER_XIAO_SENSE=1
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_opi

[env:esp32-s3-devkitc-1]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CORE_DEBUG_LEVEL=1

; The pinned Arduino package supplies esp_camera. No AI inference library is used.

