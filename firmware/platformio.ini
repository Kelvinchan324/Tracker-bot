[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CORE_DEBUG_LEVEL=1

; This first project deliberately uses only the Arduino framework.
; Camera and inference libraries should be added after the exact ESP32 camera
; module has been selected and tested.

